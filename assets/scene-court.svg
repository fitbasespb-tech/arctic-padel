<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Падел-корт под открытым небом и северным сиянием">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061634"/>
      <stop offset="0.55" stop-color="#0a2348"/>
      <stop offset="1" stop-color="#0e2c57"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.55" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#e8a90e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cf2a6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9be84b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6cf2a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc4ec" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6cf2a6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6fc4ec" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#147a9e"/>
      <stop offset="1" stop-color="#0d5e7d"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softblur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1000" height="700" fill="url(#sky)"/>

  <!-- aurora -->
  <g filter="url(#blur)" opacity="0.9">
    <path d="M-40 40 C 180 200, 220 30, 420 150 S 720 60, 1040 170 L1040 280 C 760 180, 640 300, 420 250 S 160 320, -40 200 Z" fill="url(#aur1)"/>
    <path d="M-40 120 C 220 250, 300 110, 520 220 S 820 150, 1040 240 L1040 330 C 780 250, 660 360, 460 310 S 200 380, -40 270 Z" fill="url(#aur2)"/>
  </g>

  <!-- midnight sun -->
  <circle cx="820" cy="150" r="150" fill="url(#sun)"/>
  <circle cx="820" cy="150" r="46" fill="#fff1bf"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="70" r="2" opacity=".7"/><circle cx="240" cy="40" r="1.6" opacity=".6"/>
    <circle cx="360" cy="90" r="1.4" opacity=".5"/><circle cx="540" cy="50" r="2" opacity=".7"/>
    <circle cx="640" cy="100" r="1.5" opacity=".5"/><circle cx="180" cy="150" r="1.4" opacity=".5"/>
    <circle cx="60" cy="120" r="1.6" opacity=".6"/><circle cx="460" cy="120" r="1.4" opacity=".5"/>
  </g>

  <!-- mountains -->
  <path d="M0 300 L150 200 L260 270 L360 180 L470 300 Z" fill="#0c2b52"/>
  <path d="M300 320 L470 190 L560 260 L700 160 L860 320 Z" fill="#0a2348"/>
  <path d="M620 320 L780 210 L880 280 L1000 220 L1000 340 L620 340 Z" fill="#0c2b52"/>
  <!-- snow caps -->
  <path d="M360 180 L335 215 L350 210 L362 224 L375 208 L390 214 Z" fill="#eaf3fb" opacity=".9"/>
  <path d="M700 160 L675 196 L690 190 L702 205 L716 188 L732 196 Z" fill="#eaf3fb" opacity=".9"/>

  <!-- ground -->
  <rect y="330" width="1000" height="370" fill="#07203f"/>

  <!-- padel court (perspective) -->
  <polygon points="180,640 820,640 700,360 300,360" fill="url(#court)"/>
  <!-- court lines -->
  <g stroke="#bfe6f2" stroke-width="3" opacity=".85" fill="none">
    <polygon points="180,640 820,640 700,360 300,360"/>
    <line x1="248" y1="500" x2="752" y2="500"/>
    <line x1="500" y1="360" x2="500" y2="640"/>
  </g>
  <!-- glass side walls -->
  <polygon points="300,360 180,640 180,560 300,300" fill="#6fc4ec" opacity=".16"/>
  <polygon points="700,360 820,640 820,560 700,300" fill="#6fc4ec" opacity=".16"/>
  <polygon points="300,300 700,300 700,360 300,360" fill="#9fd6ee" opacity=".12"/>
  <g stroke="#bfe6f2" stroke-width="2" opacity=".5">
    <line x1="300" y1="300" x2="300" y2="360"/><line x1="700" y1="300" x2="700" y2="360"/>
    <line x1="300" y1="300" x2="700" y2="300"/>
  </g>
  <!-- net -->
  <rect x="300" y="486" width="400" height="20" fill="#0a2348" opacity=".8"/>
  <line x1="300" y1="486" x2="700" y2="486" stroke="#e9f4fb" stroke-width="3"/>

  <!-- player 1 (left, blue) -->
  <g transform="translate(370,470)">
    <circle cx="0" cy="-78" r="16" fill="#f2c9a0"/>
    <path d="M-14 -62 Q0 -52 14 -62 L20 -8 Q0 2 -20 -8 Z" fill="#0E72B5"/>
    <rect x="-20" y="-10" width="16" height="46" rx="7" fill="#0a4f86"/>
    <rect x="4" y="-10" width="16" height="46" rx="7" fill="#0a4f86"/>
    <rect x="-22" y="34" width="18" height="12" rx="4" fill="#eef4fb"/>
    <rect x="6" y="34" width="18" height="12" rx="4" fill="#eef4fb"/>
    <!-- arm + racket -->
    <rect x="12" y="-58" width="40" height="11" rx="5" fill="#f2c9a0" transform="rotate(-32 12 -52)"/>
    <g transform="translate(48,-92) rotate(20)">
      <ellipse cx="0" cy="0" rx="17" ry="22" fill="#eef4fb" stroke="#cdd9e6" stroke-width="2"/>
      <rect x="-3" y="20" width="6" height="20" rx="3" fill="#0a2348"/>
    </g>
  </g>

  <!-- player 2 (right, orange) -->
  <g transform="translate(630,470) scale(-1,1)">
    <circle cx="0" cy="-78" r="16" fill="#e8b48a"/>
    <path d="M-14 -62 Q0 -52 14 -62 L20 -8 Q0 2 -20 -8 Z" fill="#E8430E"/>
    <rect x="-20" y="-10" width="16" height="46" rx="7" fill="#0a2348"/>
    <rect x="4" y="-10" width="16" height="46" rx="7" fill="#0a2348"/>
    <rect x="-22" y="34" width="18" height="12" rx="4" fill="#eef4fb"/>
    <rect x="6" y="34" width="18" height="12" rx="4" fill="#eef4fb"/>
    <rect x="12" y="-58" width="40" height="11" rx="5" fill="#e8b48a" transform="rotate(-32 12 -52)"/>
    <g transform="translate(48,-92) rotate(20)">
      <ellipse cx="0" cy="0" rx="17" ry="22" fill="#eef4fb" stroke="#cdd9e6" stroke-width="2"/>
      <rect x="-3" y="20" width="6" height="20" rx="3" fill="#0a2348"/>
    </g>
  </g>

  <!-- ball -->
  <circle cx="500" cy="350" r="11" fill="#c8f56a" stroke="#9be84b" stroke-width="2"/>
  <path d="M491 346 q9 5 18 0" stroke="#fff" stroke-width="1.6" fill="none" opacity=".8"/>
</svg>
